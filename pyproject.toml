[project]
name = "defend-sc"
version = "0.1.0"
description = "Experimental code for securing activation channels and plotting privacy/utility frontiers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.1.0",
    "datasets>=4.0.0",
    "flash-linear-attention>=0.5.2",
    "huggingface-hub>=1.31.0,<2.0.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0,<3.0.0",
    "pyarrow>=21.0.0",
    "safetensors>=0.4.0",
    "torch>=2.5.0",
    "transformers[torch]>=5.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
